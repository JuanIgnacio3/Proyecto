# Entorno de PRODUCCION. Coexiste con docker-compose.yml (desarrollo):
#   - Nombre de proyecto propio (`tcu-prod`) y volumen de datos propio.
#   - No expone PostgreSQL ni el backend al host; solo el proxy web (80).
#
# Uso:
#   docker compose -f docker-compose.prod.yml build
#   docker compose -f docker-compose.prod.yml up -d
#
# Variables/secretos: unicamente por ./backend/.env (ver docs/DEPLOYMENT.md).
name: tcu-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - tcu_pg_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Sin `ports`: la base de datos NO se expone al host.

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    # Sin `ports`: accesible solo por la red interna, a traves del proxy `web`.

  web:
    build:
      context: ./tailwind-admin-reactjs-free/package
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      # - "443:443"   # habilitar al montar certificados (ver docs/DEPLOYMENT.md)

volumes:
  tcu_pg_data_prod:
