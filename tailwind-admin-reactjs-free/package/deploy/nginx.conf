# Reverse proxy de produccion.
# - Sirve el build estatico del frontend (SPA con fallback a index.html).
# - Enruta /api hacia FastAPI (mismo origen -> sin CORS).
# - gzip, cache de assets con hash y cabeceras de seguridad.
# - Preparado para HTTPS (bloque comentado al final; requiere dominio + certs).
#
# Este archivo se incluye dentro del bloque http{} de nginx (conf.d/default.conf).

# --- Cabeceras de seguridad (contexto http: aplican a las respuestas HTML) ---
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
# CSP ajustada a este proyecto:
#  - script-src 'self': solo el bundle propio.
#  - style-src 'unsafe-inline' + Google Fonts: Tailwind/Radix inyectan estilos inline.
#  - connect-src api.iconify.design: los iconos (Iconify) se cargan en runtime por fetch.
#  - img-src data:: iconos/SVG embebidos como data URI.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.iconify.design; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

# --- Compresion ---
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json application/xml;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API -> FastAPI. El nombre `backend` es el servicio del docker-compose.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Assets con hash en el nombre: cache agresivo e inmutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier ruta no encontrada sirve index.html (React Router).
    location / {
        try_files $uri $uri/ /index.html;
    }
}

