name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tcu_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # La suite crea tcu_test a partir de esta URL (usuario superusuario con CREATEDB).
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/tcu_db
      # Clave ficticia válida solo para CI (cumple la validación de longitud/no-insegura).
      SECRET_KEY: ci0123456789abcdef0123456789abcdef0123456789abcdef0123456789

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

  frontend:
    name: Frontend (tsc + eslint)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: tailwind-admin-reactjs-free/package

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tailwind-admin-reactjs-free/package/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint . --max-warnings 0
